version: '3.8'

services:
  # --- Backend ---
  backend:
    build: .
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+asyncpg://postgres:postgres@db:5432/insurbridge
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AUTO_CREATE_TABLES=${AUTO_CREATE_TABLES:-true}
      - AUTO_SEED_DATA=${AUTO_SEED_DATA:-true}
      - SQL_ECHO=${SQL_ECHO:-false}
      - EXPOSE_ERROR_DETAILS=${EXPOSE_ERROR_DETAILS:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  # --- Frontend: D2C App ---
  d2c-app:
    build: ./frontend/d2c
    ports:
      - "3000:80"
    depends_on:
      - backend

  # --- Frontend: Widget ---
  widget-service:
    build: ./frontend/widget
    ports:
      - "3001:80"

  # --- Frontend: Admin Portal ---
  portal-app:
    build: ./frontend/portal
    ports:
      - "3002:80"
    depends_on:
      - backend

  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=insurbridge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

